name: build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: install linux deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev pkg-config gcc
      - name: create frontend dist placeholder
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
      - run: go vet ./...
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install linux deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev pkg-config gcc
      - name: install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: generate wailsjs
        run: wails generate module
        working-directory: ${{ github.workspace }}
      - run: npm ci
      - run: npm run build
  app:
    needs: [vet, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: mocha-desktop-windows
            artifact-path: build/bin/mocha-desktop.exe
          - os: macos-latest
            artifact-name: mocha-desktop-macos
            artifact-path: build/bin/mocha-desktop.app
          - os: ubuntu-latest
            artifact-name: mocha-desktop-linux
            artifact-path: build/bin/mocha-desktop
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev pkg-config gcc
      - name: install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: build
        run: wails build
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
